# Plan Council configuration.
#
# Panel composition is the one real choice here: every panelist reads your repository
# itself, so add a model only if you are content for it to see this code.

panel:
  # Two ChatGPT models and two Claude models: a full panel on the two subscriptions
  # that are active here. `council models` lists what each CLI actually offers right
  # now — for codex that is its own catalogue, so prefer copying a name from there
  # over typing one from memory.
  # `binary` is here because the ChatGPT desktop app does not put codex on PATH: it
  # installs it under a content-hashed directory nobody's PATH knows about. The `*` is
  # not laziness — the app mints a new hash on every update (one rotated under us while
  # this was being written), so a literal path is a config line with an expiry date.
  # The newest match wins. Delete these lines if your codex is on PATH (`npm i -g`,
  # Homebrew); `council models` says which binary it actually found.
  # `effort` is how hard a panelist is told to think: low, medium, high, xhigh, max.
  # codex and the claude CLI take the same five words; opencode has no such control and
  # setting it there is refused rather than ignored. Omit it to leave the harness on its
  # own default — for codex that is `model_reasoning_effort` in ~/.codex/config.toml,
  # which is global and applies to every codex panelist at once. Setting it here instead
  # makes it a property of this council, and lets one panelist think harder than another.
  - name: gpt
    adapter: codex_cli
    binary: C:\Users\PC_4415\AppData\Local\OpenAI\Codex\bin\*\codex.exe
    effort: high
    # model:                  # omit to use the default from ~/.codex/config.toml

  - name: gpt-alt
    adapter: codex_cli
    binary: C:\Users\PC_4415\AppData\Local\OpenAI\Codex\bin\*\codex.exe
    model: gpt-5.5           # a second, different ChatGPT model to argue with the first
    effort: high

  # These two spend the same subscription quota as the Claude Code session that
  # launched the council.
  - name: claude
    adapter: claude_cli
    # A family alias always means the newest model in that family, so it never needs
    # updating. Pin one (claude-opus-5) only when you deliberately want that version.
    model: opus
    effort: high

  - name: claude-sonnet
    adapter: claude_cli
    model: sonnet
    effort: high

  # Ollama Cloud panelists — re-enable when that subscription is active. Anything
  # beyond the free tier answers 403 without one.
  # - name: kimi
  #   adapter: opencode_cli
  #   model: ollama-cloud/kimi-k2.6
  # - name: glm
  #   adapter: opencode_cli
  #   model: ollama-cloud/glm-5.2
  # - name: deepseek
  #   adapter: opencode_cli
  #   model: ollama-cloud/deepseek-v4-pro

protocol:
  min_rounds: 2          # a first-round consensus is usually a shallow one
  max_rounds: 5

  # Cumulative real tokens across every call (each CLI's own usage; estimated only
  # when a CLI reports none). Dominated by repo exploration, not the transcript: a
  # panelist re-sends every file it reads on each agent-loop step, and providers
  # without caching pay full price each time. A single 3-model run measured ~1.1M.
  # Raised from 8M: a single glm-5.2 panelist spent 1.7M on its phase-1 plan alone
  # while exploring the Muharebe_Simulasyon repo, so a 3-model run there does not fit
  # in 8M. Lower it again for smaller repositories.
  token_budget: 20000000

  # Raised from 1800: phase 1 alone can now run to per_call_phase1 (2400s), so a 30
  # minute budget would end the session before the discussion ever started.
  wall_clock_budget: 9000

  # Summarise older rounds once the transcript passes this many tokens. Keep it
  # below the smallest panelist's context window: the prompt is this plus the task,
  # every plan, and the last two rounds verbatim.
  compaction_threshold: 200000

  anonymize: true        # panelists argue as Agent-A, Agent-B — never by brand

  # Each panelist keeps talking in the same harness conversation where it explored
  # the repo and wrote its plan, so it does not lose that context between rounds and
  # only receives what it has not yet seen. Turn this off to send a full transcript
  # reassembly every turn instead (cheaper per turn, but the panelist starts cold).
  session_continuity: true

  # Who summarises the transcript. Worth a strong model: everything the panel
  # remembers about earlier rounds comes through it.
  compaction_panelist: claude

timeouts:
  # Both raised after a run on a large C++ repository dropped two of three panelists:
  # they were still reading source when the 900s phase-1 clock expired, and the
  # session failed for want of a quorum.
  per_call: 600           # a discussion turn
  per_call_phase1: 2400   # the independent plan, including repo exploration

# skip_with_note: an unresponsive panelist sits the round out; the session fails only
# if fewer than 2 panelists remain. 'abort' stops at the first failure instead.
on_failure: skip_with_note
