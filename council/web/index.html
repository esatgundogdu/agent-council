    <!-- Before the first paint, so nobody gets a flash of the theme they did not
         choose on every reload. React sets the same attribute a moment later; this
         only wins the race. -->

      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('council.theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>

      /* The default has to be on the element before the stylesheet loads too, or the
         page paints in `:root`'s palette — paper — for one frame. */
      :root:not([data-theme]) { color-scheme: dark; background: #15110e; }
    </style>
