<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Council</title>
    <!-- Before the first paint, so somebody who chose the dark theme does not get a
         full sheet of white paper on every reload. React sets the same attribute a
         moment later; this only wins the race. -->
    <script>
      try {
        if (localStorage.getItem('council.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
